<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UAE Building Code Assistant</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link

    rel="stylesheet"

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a2b;
      --panel-2: #172238;
      --panel-3: #1d2942;
      --border: #2b3857;
      --text: #e8edf7;
      --muted: #9aa8c7;
      --primary: #4f8ef7;
      --primary-2: #7c5cff;
      --success: #2ecc71;
      --danger: #ff6b6b;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: "Inter", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(79, 142, 247, 0.14), transparent 28%),
        radial-gradient(circle at top right, rgba(124, 92, 255, 0.10), transparent 24%),
        var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      font-size: 15px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(10, 15, 28, 0.88);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      box-shadow: 0 8px 20px rgba(79, 142, 247, 0.25);
      flex-shrink: 0;
    }

    .title-wrap h1 {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      line-height: 1.2;
    }

    .title-wrap p {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 12px;
      font-weight: 700;
      color: #b8ffd0;
      background: rgba(46, 204, 113, 0.12);
      border: 1px solid rgba(46, 204, 113, 0.35);
      padding: 6px 10px;
      border-radius: 999px;
    }

    .ghost-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: 0.2s ease;
    }

    .ghost-btn:hover {
      border-color: var(--primary);
      color: #fff;
      background: rgba(79, 142, 247, 0.08);
    }

    .city-bar {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      background: rgba(18, 26, 43, 0.75);
    }

    .city-bar::-webkit-scrollbar {
      height: 6px;
    }

    .city-bar::-webkit-scrollbar-thumb {
      background: #2a3653;
      border-radius: 999px;
    }

    .city-btn {
      border: 1px solid var(--border);
      background: var(--panel);
      color: #d6def0;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 600;
      transition: 0.2s ease;
      flex-shrink: 0;
    }

    .city-btn:hover {
      border-color: var(--primary);
      color: #fff;
    }

    .city-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #fff;
